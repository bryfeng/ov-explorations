F" stroke-opacity=".3" stroke-width="1"/><circle cx="600" cy="392" r="7" fill="#9DAAFF" opacity=".7" filter="url(#soft)"/><circle cx="600" cy="392" r="2.4" fill="#fff"/><text x="622" y="396" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#C3C8CF">h(e) · a fingerprint, nothing else</text><defs><linearGradient id="gm0_1200_470" gradientUnits="userSpaceOnUse" x1="0" x2="1200" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".18" stop-color="#fff" stop-opacity="1"/><stop offset=".82" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m0_1200_470"><rect x="-80" y="350" width="1360" height="240" fill="url(#gm0_1200_470)"/></mask></defs><g mask="url(#m0_1200_470)"><ellipse cx="600.0" cy="470" rx="600.0" ry="70" fill="url(#haze)"/><line x1="0" x2="1200" y1="470" y2="470" stroke="#9DAAFF" stroke-opacity="0.07" stroke-width="64" stroke-linecap="round"/><line x1="0" x2="1200" y1="470" y2="470" stroke="#9DAAFF" stroke-opacity="0.12" stroke-width="36" stroke-linecap="round"/><line x1="0" x2="1200" y1="470" y2="470" stroke="#9DAAFF" stroke-opacity="0.22" stroke-width="18" stroke-linecap="round"/><line x1="0" x2="1200" y1="470" y2="470" stroke="#9DAAFF" stroke-opacity="0.4" stroke-width="9" stroke-linecap="round"/><line x1="0" x2="1200" y1="470" y2="470" stroke="#9DAAFF" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round"/><line x1="0" x2="1200" y1="470" y2="470" stroke="#DCE2FF" stroke-width="2.0" stroke-dasharray="26 10"/></g><path d="M150 465V475M180 465V475M210 465V475M240 465V475M270 465V475M300 465V475M330 465V475M360 465V475M390 465V475M420 465V475M450 465V475M480 465V475M510 465V475M540 465V475M570 465V475M600 465V475M630 465V475M660 465V475M690 465V475M720 465V475M750 465V475M780 465V475M810 465V475M840 465V475M870 465V475M900 465V475M930 465V475M960 465V475M990 465V475M1020 465V475M1050 465V475" stroke="#DCE2FF" stroke-opacity=".35" stroke-width="1"/><circle cx="600" cy="470" r="9" fill="#DCE2FF" opacity=".5" filter="url(#soft)"/><circle cx="600" cy="470" r="3.2" fill="#fff"/><text x="600" y="500" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#9DAAFF">the record · proposed · one order</text><text x="600" y="530" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#9AA1AB">not executed · not validated · not interpreted</text><text x="56" y="630" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:22px;font-weight:500;fill:#E9EBEE">What the record holds</text><text x="56" y="660" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#C3C8CF">Only a fingerprint goes down. The record puts fingerprints in one order and is meant to keep them available.</text><text x="56" y="682" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#9AA1AB">Content, validation and meaning stay in the system. Order is not time. A record is not proof.</text><rect width="1200" height="750" filter="url(#grain)" opacity=".9" style="mix-blend-mode:overlay"/><text x="56" y="42" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:13px;font-weight:600;fill:#E9EBEE">Open Value</text><text x="944" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">Thesis</text><text x="1044" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">How it works</text><text x="1144" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">Questions</text><text x="56" y="716" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#3A3F48">B2 · the record · one spark, one beam · event–state dissociation</text></svg>