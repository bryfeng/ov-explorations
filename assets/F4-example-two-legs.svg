or="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">open</text><path d="M282 250 C282 335.0 282 335.0 282 420" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><path d="M277 413 L282 420 L287 413" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><circle cx="282.0" cy="335.0" r="4.5" fill="#E0442F"/><text x="252" y="280" text-anchor="end" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">h(cash)</text><path d="M340 420 C340 335.0 340 335.0 340 250" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><path d="M335 243 L340 250 L345 243" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><circle cx="340.0" cy="335.0" r="4" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.5"/><path d="M602 250 C602 335.0 602 335.0 602 420" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><path d="M597 413 L602 420 L607 413" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><circle cx="602.0" cy="335.0" r="4.5" fill="#E0442F"/><text x="572" y="280" text-anchor="end" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">h(asset)</text><path d="M660 420 C660 335.0 660 335.0 660 250" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><path d="M655 243 L660 250 L665 243" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><circle cx="660.0" cy="335.0" r="4" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.5"/><path d="M940 268 C940 344.0 940 344.0 940 420" fill="none" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="1.3"/><path d="M935 413 L940 420 L945 413" fill="none" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="1.3"/><text x="970" y="280" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">checks order</text><rect x="200" y="420" width="880" height="80" rx="40" fill="none" stroke="#E0442F" stroke-width="1.6" stroke-dasharray="7 5"/><text x="240" y="446" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#E0442F">the record · proposed</text><text x="1040" y="446" text-anchor="end" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">sequence, not time</text><path d="M240 469.6 H1040" stroke="#1A1A1A" stroke-width="1.2"/><path d="M280 465.6V473.6M320 465.6V473.6M360 465.6V473.6M400 465.6V473.6M440 465.6V473.6M480 465.6V473.6M520 465.6V473.6M560 465.6V473.6M600 465.6V473.6M640 465.6V473.6M680 465.6V473.6M720 465.6V473.6M760 465.6V473.6M800 465.6V473.6M840 465.6V473.6M880 465.6V473.6M920 465.6V473.6M960 465.6V473.6M1000 465.6V473.6" stroke="#1A1A1A" stroke-opacity=".4" stroke-width="1"/><circle cx="282" cy="469.6" r="5" fill="#E0442F"/><text x="282" y="491.6" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;fill:#1A1A1A">cash · #n</text><circle cx="602" cy="469.6" r="5" fill="#E0442F"/><text x="602" y="491.6" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;fill:#1A1A1A">asset · #n+k</text><rect x="138.7" y="547" width="322.6" height="26" rx="13" fill="#F2F0EA" stroke="#6B6862" stroke-opacity=".5" stroke-width="1"/><text x="300" y="564" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">neither system adopts the other’s rules</text><rect x="490.5" y="547" width="219.0" height="26" rx="13" fill="#F2F0EA" stroke="#6B6862" stroke-opacity=".5" stroke-width="1"/><text x="600" y="564" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">inclusion is not validity</text><rect x="783.1" y="547" width="233.8" height="26" rx="13" fill="#F2F0EA" stroke="#6B6862" stroke-opacity=".5" stroke-width="1"/><text x="900" y="564" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">the order is not clock time</text><text x="600" y="630" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#6B6862">The same shape applies to a vehicle’s history across insurers and registries, to an ACH reversal recorded after the original,</text><text x="600" y="652" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#6B6862">and to value moving between an airline and a telco. All illustrative; none is a deployment.</text><line x1="56" x2="1144" y1="690" y2="690" stroke="#1A1A1A" stroke-opacity=".15"/><text x="56" y="716" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">F4 · one example · illustrative · names are placeholders</text></svg>