irs</text><text x="920" y="524" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">pairs = n(n−1)/2 · arithmetic, not a measurement</text><line x1="700" x2="700" y1="150" y2="540" stroke="#1A1A1A" stroke-opacity=".15"/><text x="600" y="620" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#1A1A1A">A shared record of order would let each system do that work once, against one reference, instead of once per counterparty.</text><text x="600" y="646" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#6B6862">Validation and interpretation do not move. Only the work of agreeing on order does.</text><line x1="56" x2="1144" y1="690" y2="690" stroke="#1A1A1A" stroke-opacity=".15"/><text x="56" y="716" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">F1 · why a shared record is needed · today · counts are arithmetic</text></svg>
