dle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#9AA1AB">the order is not clock time</text><text x="600" y="630" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#9AA1AB">The same shape applies to a vehicle’s history across insurers and registries, to an ACH reversal recorded after the original,</text><text x="600" y="652" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#9AA1AB">and to value moving between an airline and a telco. All illustrative; none is a deployment.</text><rect width="1200" height="750" filter="url(#grain)" opacity=".9" style="mix-blend-mode:overlay"/><text x="56" y="42" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:13px;font-weight:600;fill:#E9EBEE">Open Value</text><text x="944" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">Thesis</text><text x="1044" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">How it works</text><text x="1144" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">Questions</text><text x="56" y="716" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#3A3F48">B4 · one example · dark · illustrative · names are placeholders</text></svg>