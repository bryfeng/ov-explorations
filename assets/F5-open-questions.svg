t-transform:uppercase;fill:#F2F0EA">3</text><circle cx="880" cy="469.6" r="11" fill="#1A1A1A"/><text x="880" y="473.6" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:0;text-transform:uppercase;fill:#F2F0EA">4</text><text x="320" y="540" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">ordering</text><text x="320" y="558" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">who decides · no coin to stake</text><text x="600" y="540" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">availability</text><text x="600" y="558" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">kept where · by whom</text><text x="880" y="540" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">longevity</text><text x="880" y="558" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">kept how long · unpaid</text><text x="600" y="600" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;fill:#6B6862">2 identity · one actor pretending to be a million    6 behaviour · nothing to lose    5 proof · a before b across unrelated applications</text><text x="600" y="644" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#1A1A1A">A shared record is necessary for independent systems to agree on order. It is not sufficient.</text><text x="600" y="668" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:13px;font-weight:400;fill:#6B6862">Tokenless and permissionless operation are objectives of question 1, not results.</text><line x1="56" x2="1144" y1="690" y2="690" stroke="#1A1A1A" stroke-opacity=".15"/><text x="56" y="716" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">F5 · where the open questions sit · 1 ordering · 2 identity · 3 availability · 4 longevity · 5 proof · 6 behaviour</text></svg>