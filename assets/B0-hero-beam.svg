-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#9DAAFF">open research</text><text x="56" y="230" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:58px;font-weight:500;letter-spacing:-.03em;fill:#E9EBEE">A neutral, content-blind</text><text x="56" y="294" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:58px;font-weight:500;letter-spacing:-.03em;fill:#E9EBEE">root of trust.</text><text x="56" y="360" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:18px;font-weight:400;fill:#C3C8CF">Independent systems can share one record of what happened and in</text><text x="56" y="386" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:18px;font-weight:400;fill:#C3C8CF">what order, without adopting each other's rules.</text><text x="56" y="500" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#9AA1AB">The record sits underneath; everything that carries meaning</text><text x="56" y="522" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#9AA1AB">stays above it, in the systems themselves.</text><rect x="56" y="566" width="150" height="42" rx="3" fill="#E9EBEE"/><text x="131" y="592" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#14161A">read the thesis</text><rect x="222" y="566" width="200" height="42" rx="3" fill="none" stroke="#C3C8CF" stroke-opacity=".5"/><text x="322" y="592" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#C3C8CF">submit a pre-proposal</text><rect width="1200" height="750" filter="url(#grain)" opacity=".9" style="mix-blend-mode:overlay"/><text x="56" y="42" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:13px;font-weight:600;fill:#E9EBEE">Open Value</text><text x="944" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">Thesis</text><text x="1044" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">How it works</text><text x="1144" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">Questions</text><text x="56" y="716" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#3A3F48">B0 · hero · beam · the record as one line of light · dashed core = proposed</text></svg>