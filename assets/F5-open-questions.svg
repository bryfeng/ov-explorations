<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"><rect width="1200" height="750" fill="#F2F0EA"/><line x1="56" x2="1144" y1="80" y2="80" stroke="#1A1A1A" stroke-opacity=".15"/><text x="56" y="50" text-anchor="start" style="letter-spacing:-.02em;font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:26px;font-weight:600;fill:#1A1A1A">Where the open questions sit</text><text x="56" y="110" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#6B6862">The ordering service is proposed, not built. Six questions are open; each sits at a part of the figure.</text><path d="M300 252 C300 276.0 300 276.0 300 300" fill="none" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="1.3"/><circle cx="300" cy="176" r="30" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.6"/><path d="M450 252 C450 276.0 450 276.0 450 300" fill="none" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="1.3"/><circle cx="450" cy="176" r="30" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.6"/><path d="M600 252 C600 276.0 600 276.0 600 300" fill="none" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="1.3"/><circle cx="600" cy="176" r="30" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.6"/><path d="M750 252 C750 276.0 750 276.0 750 300" fill="none" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="1.3"/><circle cx="750" cy="176" r="30" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.6"/><text x="525" y="240" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">systems · each with its own rules</text><circle cx="372" cy="128" r="11" fill="#1A1A1A"/><text x="372" y="132" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:0;text-transform:uppercase;fill:#F2F0EA">2</text><text x="392" y