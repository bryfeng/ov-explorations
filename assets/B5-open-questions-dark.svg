;letter-spacing:.14em;text-transform:uppercase;fill:#E9EBEE">availability</text><text x="600" y="558" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">kept where · by whom</text><text x="880" y="540" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#E9EBEE">longevity</text><text x="880" y="558" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">kept how long · unpaid</text><text x="600" y="600" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;fill:#9AA1AB">2 identity · one actor pretending to be a million    6 behaviour · nothing to lose    5 proof · a before b across unrelated applications</text><text x="600" y="644" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#E9EBEE">A shared record is necessary for independent systems to agree on order. It is not sufficient.</text><text x="600" y="668" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:13px;font-weight:400;fill:#9AA1AB">Tokenless and permissionless operation are objectives of question 1, not results.</text><rect width="1200" height="750" filter="url(#grain)" opacity=".9" style="mix-blend-mode:overlay"/><text x="56" y="42" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:13px;font-weight:600;fill:#E9EBEE">Open Value</text><text x="944" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">Thesis</text><text x="1044" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">How it works</text><text x="1144" y="42" text-anchor="end" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:400;fill:#9AA1AB">Questions</text><text x="56" y="716" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#3A3F48">B5 · open questions · dark · 1 ordering · 2 identity · 3 availability · 4 longevity · 5 proof · 6 behaviour</text></svg>