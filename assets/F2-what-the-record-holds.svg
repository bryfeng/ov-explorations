<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"><rect width="1200" height="750" fill="#F2F0EA"/><line x1="56" x2="1144" y1="80" y2="80" stroke="#1A1A1A" stroke-opacity=".15"/><text x="56" y="50" text-anchor="start" style="letter-spacing:-.02em;font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:26px;font-weight:600;fill:#1A1A1A">What the record holds</text><text x="56" y="110" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#6B6862">Only a fingerprint goes down. Content, validation and meaning stay in the system.</text><circle cx="260" cy="176" r="34" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.6"/><g transform="translate(245.0,161.0) scale(0.7500)" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15 L20 5 L36 15 Z"/><path d="M6 34 H34 M5 37 H35"/><path d="M10 18 V31 M17 18 V31 M23 18 V31 M30 18 V31"/></g><text x="260" y="236" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">a system</text><rect x="330" y="134" width="300" height="104" rx="6" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.2"/><text x="346" y="156" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#1A1A1A">event e</text><text x="346" y="176" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">content · amounts · parties</text><text x="346" y="196" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">validated under its rules</text><text x="346" y="216" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">state derived here</text><text x="660" y="176" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#6B6862">The event stays in the system.</text><text x="660" y="196" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#6B6862">What a fingerprint reveals is the system’s choice.</text><path d="M480 240 C480 270.0 560 270.0 560 300" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><circle cx="520.0" cy="270.0" r="4.5" fill="#E0442F"/><text x="540" y="268" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#1A1A1A">h(e) · fingerprint only</text><rect x="200" y="300" width="880" height="72" rx="36" fill="#1A1A1A" fill-opacity=".035"/><rect x="200" y="300" width="880" height="72" rx="36" fill="none" stroke="#1A1A1A" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 5"/><text x="640.0" y="340.0" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">open</text><path d="M560 372 C560 396.0 560 396.0 560 420" fill="none" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="1.3"/><rect x="200" y="420" width="880" height="80" rx="40" fill="none" stroke="#E0442F" stroke-width="1.6" stroke-dasharray="7 5"/><text x="240" y="446" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#E0442F">the record · proposed</text><text x="1040" y="446" text-anchor="end" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">one order · not time</text><path d="M240 469.6 H1040" stroke="#1A1A1A" stroke-width="1.2"/><path d="M280 465.6V473.6M320 465.6V473.6M360 465.6V473.6M400 465.6V473.6M440 465.6V473.6M480 465.6V473.6M520 465.6V473.6M560 465.6V473.6M600 465.6V473.6M640 465.6V473.6M680 465.6V473.6M720 465.6V473.6M760 465.6V473.6M800 465.6V473.6M840 465.6V473.6M880 465.6V473.6M920 465.6V473.6M960 465.6V473.6M1000 465.6V473.6" stroke="#1A1A1A" stroke-opacity=".4" stroke-width="1"/><circle cx="560" cy="469.6" r="5" fill="#E0442F"/><text x="560" y="491.6" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;fill:#1A1A1A">h(e)</text><rect x="238.6" y="547" width="122.80000000000001" height="26" rx="13" fill="#F2F0EA" stroke="#6B6862" stroke-opacity=".5" stroke-width="1"/><text x="300" y="564" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">not executed</text><rect x="534.9" y="547" width="130.2" height="26" rx="13" fill="#F2F0EA" stroke="#6B6862" stroke-opacity=".5" stroke-width="1"/><text x="600" y="564" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">not validated</text><rect x="827.5" y="547" width="145.0" height="26" rx="13" fill="#F2F0EA" stroke="#6B6862" stroke-opacity=".5" stroke-width="1"/><text x="900" y="564" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">not interpreted</text><text x="600" y="630" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#1A1A1A">State is always derived from events, above the record, by each system under its own rules.</text><text x="600" y="656" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#6B6862">Order is not time. A record is not proof.</text><line x1="56" x2="1144" y1="690" y2="690" stroke="#1A1A1A" stroke-opacity=".15"/><text x="56" y="716" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">F2 · what the record holds · event–state dissociation</text></svg>