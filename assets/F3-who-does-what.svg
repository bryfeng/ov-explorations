<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"><rect width="1200" height="750" fill="#F2F0EA"/><line x1="56" x2="1144" y1="80" y2="80" stroke="#1A1A1A" stroke-opacity=".15"/><text x="56" y="50" text-anchor="start" style="letter-spacing:-.02em;font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:26px;font-weight:600;fill:#1A1A1A">Who does what</text><text x="56" y="110" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#6B6862">Fingerprints go down. A position comes back. Readers check later, on their own terms.</text><circle cx="300" cy="176" r="34" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.6"/><g transform="translate(285.0,161.0) scale(0.7500)" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15 L20 5 L36 15 Z"/><path d="M6 34 H34 M5 37 H35"/><path d="M10 18 V31 M17 18 V31 M23 18 V31 M30 18 V31"/></g><text x="300" y="236" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">system</text><rect x="390" y="244" width="230" height="64" rx="6" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.2"/><text x="406" y="266" text-anchor="start" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#1A1A1A">event e · its rules</text><text x="406" y="286" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">position #n · stored here</text><circle cx="900" cy="176" r="34" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.6"/><g transform="translate(885.0,161.0) scale(0.7500)" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="17" r="10"/><path d="M24.5 24.5 L35 35"/></g><text x="900" y="236" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">reader</text><text x="900" y="254" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">auditor · regulator · counterparty · the system later</text><path d="M866 176 H342" stroke="#1A1A1A" stroke-opacity=".45" stroke-width="1.3"/><path d="M350 170 L342 176 L350 182" fill="none" stroke="#1A1A1A" stroke-opacity=".45" stroke-width="1.3"/><circle cx="600" cy="176" r="11" fill="#1A1A1A"/><text x="600" y="180" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:0;text-transform:uppercase;fill:#F2F0EA">3</text><text x="600" y="152" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">obtains the disclosed event · recomputes h(e)</text><text x="600" y="204" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">through whatever access exists today</text><rect x="200" y="300" width="880" height="72" rx="36" fill="#1A1A1A" fill-opacity=".035"/><rect x="200" y="300" width="880" height="72" rx="36" fill="none" stroke="#1A1A1A" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 5"/><text x="640.0" y="340.0" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">open</text><path d="M282 250 C282 335.0 282 335.0 282 420" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><path d="M277 413 L282 420 L287 413" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><circle cx="282.0" cy="335.0" r="4.5" fill="#E0442F"/><circle cx="240" cy="300" r="11" fill="#1A1A1A"/><text x="240" y="304" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:0;text-transform:uppercase;fill:#F2F0EA">1</text><text x="240" y="324" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">h(e) only</text><path d="M340 420 C340 335.0 340 335.0 340 250" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><path d="M335 243 L340 250 L345 243" fill="none" stroke="#1A1A1A" stroke-opacity="0.45" stroke-width="1.3"/><circle cx="340.0" cy="335.0" r="4" fill="#F2F0EA" stroke="#1A1A1A" stroke-width="1.5"/><circle cx="340" cy="390" r="11" fill="#1A1A1A"/><text x="340" y="394" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:0;text-transform:uppercase;fill:#F2F0EA">2</text><text x="340" y="414" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">position</text><path d="M900 268 C900 344.0 900 344.0 900 420" fill="none" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="1.3"/><path d="M895 413 L900 420 L905 413" fill="none" stroke="#1A1A1A" stroke-opacity="0.3" stroke-width="1.3"/><circle cx="950" cy="300" r="11" fill="#1A1A1A"/><text x="950" y="304" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:0;text-transform:uppercase;fill:#F2F0EA">4</text><text x="950" y="324" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#1A1A1A">checks h(e) at #n</text><rect x="200" y="420" width="880" height="80" rx="40" fill="none" stroke="#E0442F" stroke-width="1.6" stroke-dasharray="7 5"/><text x="240" y="446" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#E0442F">the record · proposed</text><path d="M240 469.6 H1040" stroke="#1A1A1A" stroke-width="1.2"/><path d="M280 465.6V473.6M320 465.6V473.6M360 465.6V473.6M400 465.6V473.6M440 465.6V473.6M480 465.6V473.6M520 465.6V473.6M560 465.6V473.6M600 465.6V473.6M640 465.6V473.6M680 465.6V473.6M720 465.6V473.6M760 465.6V473.6M800 465.6V473.6M840 465.6V473.6M880 465.6V473.6M920 465.6V473.6M960 465.6V473.6M1000 465.6V473.6" stroke="#1A1A1A" stroke-opacity=".4" stroke-width="1"/><circle cx="282" cy="469.6" r="5" fill="#E0442F"/><text x="282" y="491.6" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;fill:#1A1A1A">#n</text><rect x="186.8" y="547" width="226.4" height="26" rx="13" fill="#F2F0EA" stroke="#6B6862" stroke-opacity=".5" stroke-width="1"/><text x="300" y="564" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">content never crosses down</text><rect x="523.8" y="547" width="152.4" height="26" rx="13" fill="#F2F0EA" stroke="#6B6862" stroke-opacity=".5" stroke-width="1"/><text x="600" y="564" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">no rule flows up</text><rect x="742.4" y="547" width="315.2" height="26" rx="13" fill="#F2F0EA" stroke="#6B6862" stroke-opacity=".5" stroke-width="1"/><text x="900" y="564" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;fill:#6B6862">a reversal is a new event, not an edit</text><text x="600" y="630" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:15px;font-weight:400;fill:#1A1A1A">The system stores the position next to its own record. That is the integration footprint as proposed.</text><text x="600" y="656" text-anchor="middle" style="font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:14px;font-weight:400;fill:#6B6862">Disclosure and retention stay with the system, under its existing law. The record adds no new channel.</text><line x1="56" x2="1144" y1="690" y2="690" stroke="#1A1A1A" stroke-opacity=".15"/><text x="56" y="716" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;fill:#6B6862">F3 · who does what · numbers are sequence · proposed</text></svg>